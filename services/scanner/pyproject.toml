[project]
name = "vuldetected-scanner"
version = "0.1.0"
description = "VulDetected scan worker — a Celery consumer with an SSRF-hardened egress client."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4,<6",
    "redis>=5.0,<6",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanner"]

[tool.pytest.ini_options]
# Tests live beside the package, not inside it, so the importable surface of the
# worker stays the runtime code and nothing else.
testpaths = ["tests"]
# Import `scanner` straight from the source tree. The worker is not pip-installed
# during local test runs; the container installs the package in task 4.4.
pythonpath = ["."]
