# =============================================================================
# VulDetected — local development infrastructure
# =============================================================================
# DEV ONLY. Every port published here binds to localhost and nothing in this file
# is intended for production. Production secrets, email and databases are
# managed by the deployment platform, not by this compose file.
#
# Usage (from the repository root):
#   docker compose -f infra/docker-compose.dev.yml up -d
#   docker compose -f infra/docker-compose.dev.yml ps
#   docker compose -f infra/docker-compose.dev.yml down
#   docker compose -f infra/docker-compose.dev.yml down -v   # also drop volumes
#
# Why Postgres runs in Docker: this workstation has no local `psql` client, and
# the project must stay runnable on any machine without native database setup.
# See infra/README.md.
# =============================================================================

# Pinned so container and volume names do not depend on which directory the
# command was run from. Without this, Compose derives the project name from the
# compose file's own folder and produces `infra_vuldetected-pgdata`.
name: vuldetected

services:
  postgres:
    image: postgres:16-alpine
    container_name: vuldetected-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vuldetected
      POSTGRES_PASSWORD: vuldetected
      POSTGRES_DB: vuldetected
    ports:
      # Bound to localhost only. Credentials are dev-grade by design.
      - '127.0.0.1:5432:5432'
    volumes:
      - vuldetected-pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app must not start migrating before Postgres accepts connections.
      test: ['CMD-SHELL', 'pg_isready -U vuldetected -d vuldetected']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    # Dev-only mail catcher. Nothing leaves the machine; read it at
    # http://localhost:8025 instead of a real inbox.
    image: axllent/mailpit:latest
    container_name: vuldetected-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  redis:
    # Consumed by the Python scanner worker (Celery broker + result backend).
    # Ships in Sprint 1 so the infra contract is already standing; nothing
    # connects to it until Sprint 2 introduces services/scanner.
    image: redis:7-alpine
    container_name: vuldetected-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - vuldetected-redisdata:/data
    healthcheck:
      # The scanner must not start consuming before Redis accepts connections.
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
      - scanner

  scanner:
    # Python + Celery worker. Consumes scan jobs from Redis and reports progress
    # and findings back to the web app over the authenticated callback. There is
    # no published port on purpose: jobs travel through Redis, never over HTTP
    # into the worker.
    build:
      context: ../services/scanner
      dockerfile: Dockerfile
    container_name: vuldetected-scanner
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Container DNS, not localhost: the broker lives in the `redis` service.
      CELERY_BROKER_URL: redis://redis:6379/0
      # Read by scanner/report.py; must match the web's SCANNER_CALLBACK_SECRET.
      SCANNER_CALLBACK_SECRET: '${SCANNER_CALLBACK_SECRET:-dev-scanner-callback-secret}'
      # Read by scanner/tasks.py as the fallback callback origin. `pnpm dev` runs
      # on the host, so the worker reaches it through the host gateway.
      SCANNER_CALLBACK_BASE_URL: http://host.docker.internal:3000
      # Read by scanner/egress.py. `test` is reserved for the hermetic E2E run.
      SCANNER_EGRESS_MODE: '${SCANNER_EGRESS_MODE:-strict}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # The image already runs as UID 1000 (`scanner`); pin it here too. The root
    # filesystem stays read-only and /tmp is the only writable path the worker
    # needs (Python and Celery both stage temporary files there).
    user: '1000:1000'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The worker must reach arbitrary scan targets, so this network cannot be
    # `internal: true`. It is kept apart from the default network so the worker
    # cannot reach Postgres or Mailpit (docs/security.md §3).
    networks:
      - scanner
    # One slow target must not monopolise the developer machine.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1g

networks:
  scanner:
    # Shared only by Redis and the worker, so the worker cannot reach the
    # database services on the default network. See the scanner service above.
    name: vuldetected-scanner

volumes:
  vuldetected-pgdata:
  vuldetected-redisdata:
